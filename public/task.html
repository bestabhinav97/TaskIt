<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskIt</title>
    <link rel="stylesheet" href="taskStyle.css">
</head>
<body>
    <header>
        <nav>
            <h2 class="logo">TASKIT</h2>
            <div class="searchBar">
                <input type="text" class="searchInput" placeholder="Search">
                <button class="searchBtn">SEARCH</button>
            </div>
            <ul class="navList">
                <li><a href="index.html">HOME</a></li>
                <li><a href="task.html">POST</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <button class="addTaskBtn">ADD TASK</button>
        <div class="addTaskModal">
            <div class="modalContent">
                <div class="modalHeader">
                    <h2>Add task</h2>
                    <span class="closeModal">&times;</span>
                </div>
                <form id="addTaskForm" action="POST">
                    <label for="taskName">Task Name: </label>
                    <input type="text" name="taskName" id="taskName">

                    <label for="taskDate">Task Date: </label>
                    <input type="date" name="taskDate" id="taskDate">

                    <button type="submit"class="addTaskSubmitButton"> SUBMIT </button>

                </form>
            </div>

        </div>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
