<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskIt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <h2 class="logo">TASKIT</h2>
            <div class="searchBar">
                <input type="text" class="searchInput" placeholder="Search">
                <button class="searchBtn">SEARCH</button>
            </div>
            <ul class="navList">
                <li><a href="index.html">HOME</a></li>
                <li><a href="task.html">POST</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="progressBarContainer">
                    <div class="progressBar1">
                        <div class="skill">
                            <div class="outer">
                                <div class="inner">
                                    <div class="progressNumber1Container">
                                        <h3 id="progressPercent1">55%</h3>
                                    </div>
                                </div>
                                <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
                                    <defs>
                                        <linearGradient id="GradientColor">
                                            <stop offset="0%" stop-color="#e91e63" />
                                            <stop offset="100%" stop-color="#673ab7" />
                                        </linearGradient>
                                    </defs>

                                    <circle id="progressCircle1" cx="100" cy="100" r="90" stroke="url(#GradientColor)"
                                            stroke-width="20" fill="none" stroke-linecap="round" />
                                </svg>

                            </div>
                        </div>
                    </div>
                </div>

    </main>
    <script type="module" src="js/homePage.js"></script>
</body>
</html>
